[package]
name = "timelock-encryption"
version = "0.1.0"
edition = "2024"

[dependencies]
drand-verify = "0.6.2"
hex = "0.4.3"
hex-literal = "1.1.0"
reqwest = {version = "0.13.5", features = ["json"]}
serde = {version = "1.0.229", features = ["derive"]}
time = {version = "0.3.55", features = ["parsing", "macros"]}
tokio = {version = "1.54.0", features = ["full"]}
