[package]
name = "timelock-encryption"
version = "0.1.0"
edition = "2024"

[dependencies]
blst = "0.3.17"
hex = "0.4.3"
hex-literal = "1.1.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = {version = "1.0.229", features = ["derive"]}
sha2 = "0.11.1"
time = {version = "0.3.55", features = ["parsing", "macros"]}
tokio = { version = "1", features = ["full"] }
